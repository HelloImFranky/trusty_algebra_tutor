server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;   # SSE tutor stream
    proxy_read_timeout 300s;
  }

  location / {
    try_files $uri /index.html;
  }
}
