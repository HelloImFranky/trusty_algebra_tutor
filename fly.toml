# fly.toml app configuration file generated for trusty-algebra-tutor on 2026-07-10T03:31:12Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'trusty-algebra-tutor'
primary_region = 'ewr'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATA_DIR = '/data'
  NODE_ENV = 'production'

[[mounts]]
  source = 'tutor_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[checks]
  [checks.health]
    port = 3000
    type = 'http'
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    path = '/'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
