# Fly.io deployment for the Algebra Tutor (one machine serves the student
# PWA + API; Fly Postgres holds the data). Deploy with:  ./scripts/deploy-fly.sh
# (or: fly launch --copy-config, fly postgres create + attach, fly deploy)
app = "algebra-tutor"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "tutor_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[checks]
  [checks.health]
    type = "http"
    port = 3000
    path = "/"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
