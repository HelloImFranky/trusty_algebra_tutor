# Local/production-ish stack (design doc §5: containerized deploy).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: tutor
      POSTGRES_DB: algebra_tutor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tutor -d algebra_tutor']
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgres://tutor:tutor@db:5432/algebra_tutor
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PORT: 4000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '4000:4000'

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      - api
    ports:
      - '8080:80'

volumes:
  pgdata:
