# Run the whole app with one command:  docker compose up
#
# No configuration required. This starts a database and the app (frontend +
# API on one URL), auto-generates a secure login secret, runs migrations, and
# seeds the full curriculum. Then open http://localhost:8080
#
# Optional: to enable the AI tutor chat, put a line ANTHROPIC_API_KEY=sk-...
# in a file named ".env" next to this file (the app works without it).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: tutor
      POSTGRES_DB: algebra_tutor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tutor -d algebra_tutor']
      interval: 5s
      retries: 15

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://tutor:tutor@db:5432/algebra_tutor
      # Optional AI tutor key; blank is fine (app falls back to built-in hints).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PORT: '4000'
    volumes:
      - appdata:/data # persists the auto-generated login secret
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8080:4000' # open http://localhost:8080

volumes:
  pgdata:
  appdata:
