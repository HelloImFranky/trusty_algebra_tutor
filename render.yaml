# One-click deploy to Render (https://render.com) — no terminal needed.
# Provisions a managed PostgreSQL database and one web service, wires them
# together, and generates a secure JWT secret automatically. The app runs its
# own migrations and seeds the full curriculum on first boot.
#
# To deploy: push this repo to GitHub, then in the Render dashboard choose
# "New +" > "Blueprint" and pick this repository. Everything below is applied
# automatically. (Or use the "Deploy to Render" button in the README.)

databases:
  - name: algebra-tutor-db
    plan: free # upgrade for a class/school; free is fine to try it out
    postgresMajorVersion: '16'

services:
  - type: web
    name: algebra-tutor
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /data # persists the JWT secret across deploys/restarts
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: algebra-tutor-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # Render generates a strong secret for you
      - key: PORT
        value: '4000'
      # Optional AI tutor chat — set these in the Render dashboard. Leave them
      # unset and the app uses the built-in step-by-step hints. For a free open
      # model on Hugging Face, set TUTOR_PROVIDER=openai, HF_TOKEN=hf_..., and
      # TUTOR_MODEL=Qwen/Qwen2.5-7B-Instruct. For Claude, set ANTHROPIC_API_KEY.
      - key: TUTOR_PROVIDER
        sync: false
      - key: TUTOR_MODEL
        sync: false
      - key: TUTOR_BASE_URL
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: TUTOR_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
