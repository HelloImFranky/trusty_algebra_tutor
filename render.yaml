# One-click deploy to Render (https://render.com) — no terminal needed.
# Provisions a managed PostgreSQL database and one web service, wires them
# together, and generates a secure JWT secret automatically. The app runs its
# own migrations and seeds the full curriculum on first boot.
#
# To deploy: push this repo to GitHub, then in the Render dashboard choose
# "New +" > "Blueprint" and pick this repository. Everything below is applied
# automatically. (Or use the "Deploy to Render" button in the README.)

databases:
  - name: algebra-tutor-db
    plan: free # upgrade for a class/school; free is fine to try it out
    postgresMajorVersion: '16'

services:
  - type: web
    name: algebra-tutor
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /data # persists the JWT secret across deploys/restarts
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: algebra-tutor-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # Render generates a strong secret for you
      - key: PORT
        value: '4000'
      # Optional: enables the AI tutor chat. Leave unset and the app falls back
      # to the built-in step-by-step hints. Set it in the Render dashboard.
      - key: ANTHROPIC_API_KEY
        sync: false
